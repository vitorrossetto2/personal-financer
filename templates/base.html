<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovoSaldo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="brand"><a href="{{ url_for('dashboard') }}">NovoSaldo</a><span>controle financeiro</span></div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Visão mensal</a>
      <a href="{{ url_for('manage_accounts') }}">Contas</a>
      <a href="{{ url_for('transactions', kind='income') }}">Receitas</a>
      <a href="{{ url_for('transactions', kind='expense') }}">Despesas</a>
      <a href="{{ url_for('credit_cards') }}">Cartões</a>
      <a href="{{ url_for('deleted_transactions') }}">Excluídos</a>
      <a href="{{ url_for('projection') }}">Projeção</a>
      <form action="{{ url_for('logout') }}" method="post"><button class="nav-button" type="submit">Sair</button></form>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('submit', async (event) => {
      const form = event.target.closest('.async-settle-form');
      if (!form) return;
      event.preventDefault();
      const button = form.querySelector('button');
      if (button.disabled) return;
      button.disabled = true;
      try {
        const response = await fetch(form.action, { method: 'POST', headers: { Accept: 'application/json' }, credentials: 'same-origin' });
        if (!response.ok) throw new Error('Não foi possível atualizar a baixa.');
        const result = await response.json();
        const settled = result.status === 'settled';
        const row = form.closest('tr');
        const badge = row.querySelector('.badge');
        row.classList.toggle('settled-row', settled);
        row.classList.toggle('overdue-row', !settled && form.dataset.pendingClass === 'overdue');
        badge.className = `badge ${settled ? 'settled' : form.dataset.pendingClass}`;
        badge.textContent = settled ? (row.querySelector('.income') ? 'Recebida' : 'Paga') : form.dataset.pendingLabel;
        button.textContent = settled ? 'Desfazer' : 'Dar baixa';
        const flash = document.createElement('div');
        flash.className = 'flash success';
        flash.textContent = result.message;
        document.querySelector('main').prepend(flash);
      } catch (error) {
        const flash = document.createElement('div');
        flash.className = 'flash error';
        flash.textContent = error.message;
        document.querySelector('main').prepend(flash);
      } finally {
        button.disabled = false;
      }
    });
  </script></body>
</html>
