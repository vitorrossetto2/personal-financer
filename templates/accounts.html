{% extends 'base.html' %}{% block content %}<div class="page-title"><div><h1>Contas bancárias</h1><p>Atualize os saldos reais de Itaú e Bradesco. Eles são a base dos cálculos do painel.</p></div></div><section class="account-grid">{% for account in accounts %}<form class="panel account-form" method="post"><input type="hidden" name="account_id" value="{{ account.id }}"><h2>{{ account.name }}</h2><label>Saldo atual<input name="balance" type="text" inputmode="decimal" value="{{ ('%.2f'|format(account.balance)).replace('.', ',') }}" required></label><small>Última atualização: {{ account.updated_at[:16].replace('T', ' ') }}</small><button>Salvar saldo</button></form>{% endfor %}</section>{% endblock %}
